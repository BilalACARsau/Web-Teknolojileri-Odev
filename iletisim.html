    <main class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h2 class="fw-bold mb-4 text-center"><i class="fa-solid fa-envelope-open-text me-2 text-primary"></i>İletişim Formu</h2>
                    
                    <form id="contactForm" action="gonder.php" method="POST">
                        
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Adınız Soyadınız</label>
                            <input type="text" name="ad_soyad" class="form-control" id="fullName" placeholder="Bilal Acar">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">E-posta Adresiniz</label>
                            <input type="text" name="email" class="form-control" id="email" placeholder="b2412100001@sakarya.edu.tr">
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Telefon Numaranız</label>
                            <input type="text" name="telefon" class="form-control" id="phone" placeholder="5XXXXXXXXX" maxlength="10">
                            <div class="form-text">Başında 0 olmadan 10 haneli giriniz.</div>
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label fw-semibold">Konu</label>
                            <select name="konu" class="form-select" id="subject">
                                <option value="">Seçiniz...</option>
                                <option value="Web Projesi">Web Projesi</option>
                                <option value="Gömülü Sistemler">Gömülü Sistemler</option>
                                <option value="Genel">Genel</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Cinsiyet</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="male" value="Erkek">
                                <label class="form-check-label" for="male">Erkek</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="female" value="Kadın">
                                <label class="form-check-label" for="female">Kadın</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label fw-semibold">Mesajınız</label>
                            <textarea name="mesaj" class="form-control" id="message" rows="4" placeholder="Mesajınızı detaylandırın..."></textarea>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" name="onay" class="form-check-input" id="kvkk">
                            <label class="form-check-label small" for="kvkk">Bilgilerimin doğruluğunu ve gönderilmesini onaylıyorum.</label>
                        </div>

                        <div class="row g-2">
                            <div class="col-md-6">
                                <button type="button" class="btn btn-primary w-100 py-2" onclick="validateNative()">
                                    <i class="fa-solid fa-code me-2"></i>Native JS ile Gönder
                                </button>
                            </div>
                            <div class="col-md-6">
                                <button type="button" class="btn btn-success w-100 py-2" id="vueSubmit">
                                    <i class="fa-brands fa-vuejs me-2"></i>Vue.js ile Gönder
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">

    <script>
    function validateNative() {
        const adSoyad = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const telefon = document.getElementById('phone').value.trim();
        const konu = document.getElementById('subject').value;
        const mesaj = document.getElementById('message').value.trim();
        const cinsiyet = document.querySelector('input[name="cinsiyet"]:checked');
        const kvkk = document.getElementById('kvkk').checked;

        // Regex Tanımları
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^[0-9]+$/; // Ödev: Sadece rakam kontrolü

        // 1. Boş Alan Kontrolleri
        if (!adSoyad || !email || !telefon || !konu || !mesaj || !cinsiyet) {
            alert("Lütfen tüm alanları doldurunuz!");
            return false;
        }

        // 2. Email Format Kontrolü
        if (!emailRegex.test(email)) {
            alert("Geçersiz e-posta formatı!");
            return false;
        }

        // 3. Telefon Rakam Kontrolü
        if (!phoneRegex.test(telefon) || telefon.length !== 10) {
            alert("Telefon numarası sadece rakamlardan oluşmalı ve 10 hane olmalıdır!");
            return false;
        }

        // 4. KVKK Kontrolü
        if (!kvkk) {
            alert("Lütfen onay kutusunu işaretleyiniz!");
            return false;
        }

        // Başarılı ise formu gönder
        alert("Native JS Kontrolü Başarılı! Veriler PHP sayfasına gönderiliyor...");
        document.getElementById('contactForm').submit();
    }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
