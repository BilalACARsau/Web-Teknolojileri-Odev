    <div class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4 fw-bold">Sisteme Giriş</h3>
                        
                        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm" action="login_isle.php" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label text-muted">Kullanıcı Adı (Öğrenci E-posta)</label>
                                <input type="text" class="form-control form-control-lg" id="email" name="email" placeholder="Örn: b2412100001@sakarya.edu.tr">
                            </div>
                            <div class="mb-4">
                                <label for="sifre" class="form-label text-muted">Şifre (Öğrenci No)</label>
                                <input type="password" class="form-control form-control-lg" id="sifre" name="sifre" placeholder="Örn: b2412100001">
                            </div>
                            <button type="submit" class="btn btn-dark w-100 btn-lg">Giriş Yap</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Bilal Acar - Tüm Hakları Saklıdır.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. PHP'den Gelen Hataları URL'den Yakalama
        const urlParams = new URLSearchParams(window.location.search);
        const errorAlert = document.getElementById('errorAlert');

        if (urlParams.get('error') === 'yanlis_bilgi') {
            errorAlert.textContent = "Hatalı e-posta veya şifre girdiniz!";
            errorAlert.classList.remove('d-none');
        } else if (urlParams.get('error') === 'bos_alan') {
            errorAlert.textContent = "Lütfen alanları boş bırakmayınız!";
            errorAlert.classList.remove('d-none');
        }

        // 2. JavaScript ile Form Validasyonu (Gönderilmeden Önce)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value.trim();
            const sifre = document.getElementById('sifre').value.trim();
            
            // Basit E-posta Regex Kontrolü
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === '' || sifre === '') {
                e.preventDefault(); // Formu durdur
                errorAlert.textContent = "E-posta veya şifre boş bırakılamaz!";
                errorAlert.classList.remove('d-none');
            } else if (!emailPattern.test(email)) {
                e.preventDefault(); // Formu durdur
                errorAlert.textContent = "Geçerli bir e-posta adresi girmelisiniz!";
                errorAlert.classList.remove('d-none');
            } else {
                errorAlert.classList.add('d-none'); // Her şey tamamsa hatayı gizle ve formun gitmesine izin ver
            }
        });
    </script>
